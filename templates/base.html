<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Vyshnavi | Portfolio{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

<header class="navbar">
    <div class="container nav-content">

        <a href="/" class="logo">
            V<span>.</span>
        </a>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#internships">Experience</a>
            <a href="#projects">Projects</a>
            <a href="#education">Education</a>
            <a href="#certifications">Certificates</a>
            <a href="#contact">Contact</a>
        </nav>

        <form action="{{ url_for('set_theme') }}" method="POST">
            <button class="theme-button" type="submit">
                {% if theme == "dark" %}
                    ☀ Light
                {% else %}
                    ☾ Dark
                {% endif %}
            </button>
        </form>

    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>Designed & Built by <span>Vyshnavi</span> | © 2026</p>
</footer>

</body>
</html>
